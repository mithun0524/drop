name = "drop-signal"
main = "src/index.js"
compatibility_date = "2024-09-01"

# The app and its signaling live on one origin: assets are served first, and
# /ws falls through to the worker. One deploy, one HTTPS URL, no CORS.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]
